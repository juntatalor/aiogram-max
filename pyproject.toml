[project]
name = "aiogram-max"
version = "0.3.0"
description = "Запускает aiogram-бота в мессенджере MAX: подменяем сессию, код бота не трогаем"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Sergey Borisov", email = "juntatalor@gmail.com" }]
keywords = ["aiogram", "max", "messenger", "bot", "telegram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "aiogram>=3.20",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/juntatalor/aiogram-max"
Issues = "https://github.com/juntatalor/aiogram-max/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiogram_max"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 ловят кириллицу, похожую на латиницу — защита от homoglyph-атак
# в англоязычном коде. У нас комментарии и докстринги по-русски целиком,
# поэтому правило даёт только шум: 98 срабатываний на нормальных словах.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
# Тесты и скрипты держим типизированными, но без придирок к возвращаемым
# значениям pytest-фикстур и argv.
disallow_untyped_decorators = false
